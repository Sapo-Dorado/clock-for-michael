<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Clock for Michael" />
  <meta name="theme-color" content="#1a1a2e" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <title>Clock for Michael</title>
  <style>
    :root {
      --bg: #1a1a2e;
      --ink: #ffffff;
      --ink-dim: rgba(255,255,255,0.35);
      --ink-hover: rgba(255,255,255,0.6);
      --accent: rgba(255,255,255,0.9);
      --surface: rgba(255,255,255,0.06);
      --surface-hover: rgba(255,255,255,0.12);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg);
      overflow: hidden;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      color: var(--ink);
    }
    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      padding:
        env(safe-area-inset-top, 0)
        env(safe-area-inset-right, 0)
        env(safe-area-inset-bottom, 0)
        env(safe-area-inset-left, 0);
    }

    /* ── Tab bar ── */
    .tabs {
      display: flex;
      justify-content: center;
      gap: 0;
      padding: 20px 0 0;
      position: relative;
      flex-shrink: 0;
    }
    .tab {
      background: none;
      border: none;
      color: var(--ink-dim);
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 12px 24px;
      cursor: pointer;
      transition: color 0.3s ease;
      position: relative;
    }
    .tab:hover {
      color: var(--ink-hover);
    }
    .tab.active {
      color: var(--accent);
    }
    .tab-indicator {
      position: absolute;
      bottom: 0;
      height: 1.5px;
      background: var(--accent);
      transition: left 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                  width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 1px;
    }

    /* ── Panels ── */
    .panels {
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    .panel {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .panel.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* ── Clock ── */
    #clock {
      font-size: clamp(80px, 20vw, 260px);
      line-height: 1;
      font-weight: 300;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
      text-align: center;
    }

    /* ── Countdown ── */
    #countdown-panel {
      gap: 32px;
    }

    #countdown-form {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    #countdown-form label {
      font-size: clamp(14px, 2.5vw, 18px);
      font-weight: 400;
      color: var(--ink-dim);
      letter-spacing: 0.04em;
    }
    #countdown-form input[type="datetime-local"] {
      font-family: inherit;
      font-size: clamp(18px, 4vw, 26px);
      font-weight: 300;
      padding: 10px 18px;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      background: var(--surface);
      color: var(--ink);
      outline: none;
      color-scheme: dark;
      transition: border-color 0.2s ease, background 0.2s ease;
    }
    #countdown-form input[type="datetime-local"]:focus {
      border-color: rgba(255,255,255,0.35);
      background: var(--surface-hover);
    }
    #countdown-form button {
      font-family: inherit;
      font-size: clamp(14px, 2.5vw, 18px);
      font-weight: 500;
      padding: 10px 28px;
      border: none;
      border-radius: 10px;
      background: var(--surface-hover);
      color: var(--ink);
      cursor: pointer;
      letter-spacing: 0.02em;
      transition: background 0.2s ease;
    }
    #countdown-form button:hover {
      background: rgba(255,255,255,0.18);
    }
    #countdown-form button:active {
      background: rgba(255,255,255,0.25);
    }

    #countdown-display {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    #countdown-display.active {
      display: flex;
    }
    #countdown-display .time {
      font-size: clamp(48px, 14vw, 180px);
      font-weight: 300;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
      text-align: center;
      line-height: 1;
    }
    #countdown-display .label {
      font-size: clamp(12px, 2vw, 16px);
      color: var(--ink-dim);
      font-weight: 400;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    #countdown-display .time.past {
      font-size: clamp(28px, 6vw, 56px);
      font-weight: 500;
    }

    #reset-countdown {
      margin-top: 8px;
      background: none;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      color: var(--ink-dim);
      font-family: inherit;
      font-size: 13px;
      font-weight: 400;
      padding: 7px 20px;
      cursor: pointer;
      letter-spacing: 0.04em;
      transition: color 0.2s ease, border-color 0.2s ease;
      display: none;
    }
    #reset-countdown.active {
      display: block;
    }
    #reset-countdown:hover {
      color: var(--ink-hover);
      border-color: rgba(255,255,255,0.25);
    }
  </style>
</head>
<body>
  <nav class="tabs">
    <button class="tab active" data-tab="clock">Clock</button>
    <button class="tab" data-tab="countdown">Countdown</button>
    <div class="tab-indicator"></div>
  </nav>

  <div class="panels">
    <div class="panel active" id="clock-panel">
      <div id="clock"></div>
    </div>

    <div class="panel" id="countdown-panel">
      <div id="countdown-form">
        <label>Event date &amp; time</label>
        <input type="datetime-local" id="event-input" />
        <button type="button" id="set-event">Start countdown</button>
      </div>
      <div id="countdown-display">
        <div class="time" id="countdown-time"></div>
        <div class="label" id="countdown-label"></div>
      </div>
      <button id="reset-countdown">Reset</button>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
  <script src="app.js"></script>
</body>
</html>
